<div class="notice"><strong>L1 有聲試閱｜插畫與聲音仍待家長整體驗收</strong>　正文已鎖稿，每幕皆有候選插畫。旁白為 Serena A 候選女聲，仍有非台灣國語口音；本篇尚未達 L2 定稿或 L3 正式出版。</div>

<p class="note">同版正文、完整旁白與逐幕候選插畫。機器檢查不等於家長完整聽審；任何持有網址的人均可觀看。</p>
</main><script>const STORY={"title":"故事書裡的小星星","scenes":[{"title":"第一張書籤還在","text":"米米把床邊的小燈轉向桌面，圓圓抱來那本熟悉的故事書。書封上的金色星星亮著柔柔的光，像還記得他們第一次坐在地毯上的樣子。米米的紅領結輕輕碰著書邊，圓圓的藍色牛仔吊帶褲上落著一片窗影。翻開第一頁，一張舊書籤還好好地夾在裡面。那是第一晚從月光花園回來時，書中留下的書籤，上面畫著黃色小花。圓圓托在手掌裡看看，再放回第一頁。『它沒有不見。』他說。今晚，兩個朋友沒有急著走進別的世界，只想坐在桌邊，再翻翻一起看過的地方。"},{"title":"書頁上的小窗戶","text":"有一頁慢慢亮起，現出魔法小星球的觀星台。小窗戶般的星群浮在紙上，中間的亮星一會兒被雲遮住，一會兒又露出來。『我記得那時很想快點找到它。』圓圓說。米米把兩隻手放在桌邊，想起並排的三張小畫。『我喜歡先把看到的畫下來，再看一次。』他說。圓圓點點頭：『我記得等它回來時，肚子裡鬆鬆的。』同一個夜晚，兩人記住的地方有些不同。書頁也沒有催他們只選一個答案，雲仍慢慢走著，星星仍安靜地從雲邊露出光。"},{"title":"不一樣的小辦法","text":"下一頁有綠色小車和彎彎的葉子路。圓圓笑著比出小車的白輪圈：『那天，我想自己推小車，你在旁邊排葉子。』米米也笑了：『後來我還幫你看轉彎的地方。』再翻一頁，三張下午小卡出現了，旁邊留著一塊小小的軟墊。圓圓想起自己中間休息，後來又換了順序。米米想起那天桌上，他們各自畫著不一樣的東西。『我今天想先看看，不一定要馬上畫。』米米說。圓圓便把書往兩人中間挪一點。書桌不大，卻能放下推小車、畫畫、歇一會兒，好多不相同的小辦法。"},{"title":"新的小星星有了形狀","text":"翻到這一晚的最後一頁，紙上出現一點淺金色的光。它沒有變成新的路，而是在書頁上慢慢展開，成了一顆有圓角的小星星。光淡下來後，一張星星形狀的紙書籤落在桌面。『這是今晚新留下的。』米米說。圓圓打開第一頁，讓原來的小花圖樣書籤也露出一角。兩張書籤一張畫著黃色小花，一張整張就是淺金色小星星，樣子和來的時候都不一樣。米米沒有把舊的換掉。他把新星星托起來，紙邊柔柔的，像今晚書頁最後留給他們的一個小小座位。"},{"title":"一張留在開始一張陪明天","text":"兩個朋友商量，讓小花書籤留在最初那一頁，星星書籤夾在今晚看到的地方。圓圓先扶好書，米米才把新的星形紙放進去，兩張都沒有折到。合上書時，小花圖案的一角和小星星的一角，從不同的頁邊輕輕露出來。『明天翻開，還會有別的地方。』圓圓說。米米點點頭，卻沒有急著猜明天要怎麼走。他們把書放回床邊，躺進各自的小毯子。桌上的燈暗了一點，窗影也慢慢移開。第一頁的小花陪著開始，今晚的小星星陪著翻到的這一頁，兩個朋友就這樣，帶著各自喜歡的回憶睡著了。"}],"boundaries":[46.71,94.67,146.05,196.45],"pictures":{"1":"images/scene-01.webp","2":"images/scene-02.webp","3":"images/scene-03.webp","4":"images/scene-04.webp","5":"images/scene-05.webp"},"pauseAfterScene":2,"pauseQuestion":"同一段冒險裡，你想記住的是哪一個小地方？","closingQuestion":"如果有一張自己的小書籤，你想把它夾在哪一頁？"};
const $=id=>document.getElementById(id);
const audio=$('audio');let current=0;
function render(i){
 current=Math.max(0,Math.min(STORY.scenes.length-1,i));
 const n=current+1,scene=STORY.scenes[current];
 $('sceneNo').textContent='SCENE '+String(n).padStart(2,'0')+' / '+String(STORY.scenes.length).padStart(2,'0');
 $('sceneTitle').textContent=scene.title;$('text').textContent=scene.text;
 $('pagination').textContent=n+' / '+STORY.scenes.length;
 $('prev').disabled=current===0;$('next').disabled=current===STORY.scenes.length-1;
 const src=STORY.pictures[String(n)];
 $('picture').hidden=!src;$('noPicture').hidden=!!src;
 if(src){$('picture').src=src;$('picture').alt='第'+n+'幕未驗收候選插畫'}
 $('artNote').textContent=src?(STORY.artNote||'L1 候選插畫｜尚未通過家長 L2 美術定稿驗收'):'第 '+n+' 幕｜正式插畫尚未完成';
 const question=n===STORY.pauseAfterScene?'親子互動（可略過）：'+STORY.pauseQuestion:n===STORY.scenes.length?'睡前的小問題：'+STORY.closingQuestion:'';
 $('question').hidden=!question;$('question').textContent=question;
 Array.from($('progress').children).forEach((p,j)=>p.classList.toggle('active',j<=current));Array.from($('chapterNav').children).forEach((p,j)=>{p.classList.toggle('active',j===current);p.setAttribute('aria-current',j===current?'step':'false');});
}
function seekTo(i){const j=Math.max(0,Math.min(STORY.scenes.length-1,i));audio.currentTime=j?STORY.boundaries[j-1]+0.06:0;render(j)}
$('prev').onclick=()=>seekTo(current-1);$('next').onclick=()=>seekTo(current+1);
audio.ontimeupdate=()=>{const page=STORY.boundaries.filter(t=>audio.currentTime>=t).length;if(page!==current)render(page)};
STORY.scenes.forEach((scene,i)=>{$('progress').appendChild(document.createElement('span'));const b=document.createElement('button');b.type='button';b.innerHTML='<span class="chapter-number">第 '+(i+1)+' 幕</span>';const span=document.createElement('span');span.textContent=scene.title;b.appendChild(span);b.onclick=()=>seekTo(i);$('chapterNav').appendChild(b)});render(0);
</script></body></html>
