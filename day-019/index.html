</main><script>const STORY={"title":"小魚今天不開心","scenes":[{"title":"今天先不玩","text":"神奇故事書的藍光小路伸進海底，讓米米和圓圓在這一頁裡也能自然呼吸。白兔米米戴著紅領結，棕熊圓圓穿著藍色牛仔吊帶褲，來找小魚玩布魚遊戲。他們到了大貝殼旁，卻看見小魚低低地停在座位邊，尾巴動得很慢。『你要一起玩嗎？』圓圓問。小魚搖搖頭：『今天不想玩，我不太開心。』圓圓把大布魚收在自己身旁，沒有把它推到小魚眼前。米米也在離牠一點點遠的地方停下來。大貝殼上落著柔柔的光，小魚低頭看著自己的尾巴，沒有再接著說話。"},{"title":"可以安靜陪一下","text":"米米輕聲問：『你想自己待一下，還是想有人陪？』小魚看看空空的貝殼座位，又看看兩位朋友。『可以陪我，可是我現在不想一直說話。』牠說。『好。』米米回答。圓圓坐下，把腳收在自己面前，替小魚留出一條寬寬的路。一片自然落下的海草葉慢慢漂過來，轉了半圈，又漂向遠處。誰也沒有追著它跑。圓圓看看米米，米米也安靜地坐著。小魚的尾巴動了一下，座位旁還有牠可以自在轉身的空間。過了一會兒，小魚挪到座位旁邊：『我想沿著沙路游一下。』米米抬起頭，等牠再說下一句。"},{"title":"跟著慢慢的尾巴","text":"『你們可以在旁邊走嗎？』小魚問。『可以呀。』圓圓站起來，布魚仍收在手裡。小魚游得慢，他們就慢慢走；小魚停下，他們也看看周圍。沙路上有一條一條淺淺的紋，像有人用大梳子輕輕梳過。圓圓差點想叫小魚看，抬起手後，又輕輕放回身旁。小魚自己低下頭，沿著其中一條紋望過去。前面兩塊平石之間，有柔柔的光落下來。『我想到那裡。』牠說。小魚又停了一下，看看身旁兩位朋友，才擺動尾巴。三個朋友便一起往那片光慢慢靠近。"},{"title":"心情還在這裡","text":"到了平石旁，小魚輕輕說：『我本來想跟表姐一起來，可是她今天不能來。』米米點點頭：『你本來很期待。』小魚嗯了一聲，又安靜了。牠在兩塊平石之間選了一個位置，沒有再往前，米米就在旁邊站著等。圓圓把布魚放在自己的膝上，聽見遠處有輕輕的沙沙聲。光在平石上移了一點，小魚也跟著望過去。『我還是有一點不開心。』牠說。『嗯，我還在這裡。』米米回答。他沒有再問小魚要不要笑，也沒有猜表姐什麼時候會來。圓圓坐在另一邊，陪他們看著那一小片光。"},{"title":"留一個安靜的位置","text":"後來，小魚說想回大貝殼旁。三個朋友又慢慢走回去，路上的沙紋還是一條一條的。剛才那片海草葉已經漂到遠遠的地方，大貝殼卻仍在同樣的位置等著牠。米米問：『你想再有人陪，還是先自己休息？』小魚選了休息：『今天謝謝你們陪我走。』圓圓點點頭，把布魚帶在自己身邊，沒有留下要牠趕快玩的禮物。小魚靠在座位旁，看起來還有一點悶悶的，也能安安靜靜待著。兩個朋友沿著藍光小路回到暖暖的房間。書頁慢慢合起，他們想到那條一起走過的路，腳步也跟著放輕了。"}],"boundaries":[43.94,94.9,141.94,191.23],"pictures":{"1":"images/scene-01.webp","2":"images/scene-02.webp","3":"images/scene-03.webp","4":"images/scene-04.webp","5":"images/scene-05.webp"},"pauseAfterScene":2,"pauseQuestion":"如果你今天不太想說話，希望朋友怎麼陪你？","closingQuestion":"有點不開心的時候，你想有人坐近一點，還是留多一點空間？"};
const $=id=>document.getElementById(id);
const audio=$('audio');let current=0;
function render(i){
 current=Math.max(0,Math.min(STORY.scenes.length-1,i));

 $('sceneTitle').textContent=scene.title;$('text').textContent=scene.text;
 $('pagination').textContent=n+' / '+STORY.scenes.length;
 $('prev').disabled=current===0;$('next').disabled=current===STORY.scenes.length-1;
 const src=STORY.pictures[String(n)];
 $('picture').hidden=!src;$('noPicture').hidden=!!src;
 if(src){$('picture').src=src;$('picture').alt='第'+n+'幕未驗收候選插畫'}
 $('artNote').textContent=src?(STORY.artNote||'L1 候選插畫｜尚未通過家長 L2 美術定稿驗收'):'第 '+n+' 幕｜正式插畫尚未完成';
 const question=n===STORY.pauseAfterScene?'親子互動（可略過）：'+STORY.pauseQuestion:n===STORY.scenes.length?'睡前的小問題：'+STORY.closingQuestion:'';
 $('question').hidden=!question;$('question').textContent=question;
 Array.from($('progress').children).forEach((p,j)=>p.classList.toggle('active',j<=current));Array.from($('chapterNav').children).forEach((p,j)=>{p.classList.toggle('active',j===current);p.setAttribute('aria-current',j===current?'step':'false');});
}
function seekTo(i){const j=Math.max(0,Math.min(STORY.scenes.length-1,i));audio.currentTime=j?STORY.boundaries[j-1]+0.06:0;render(j)}
$('prev').onclick=()=>seekTo(current-1);$('next').onclick=()=>seekTo(current+1);
audio.ontimeupdate=()=>{const page=STORY.boundaries.filter(t=>audio.currentTime>=t).length;if(page!==current)render(page)};
STORY.scenes.forEach((scene,i)=>{$('progress').appendChild(document.createElement('span'));const b=document.createElement('button');b.type='button';b.innerHTML='<span class="chapter-number">第 '+(i+1)+' 幕</span>';const span=document.createElement('span');span.textContent=scene.title;b.appendChild(span);b.onclick=()=>seekTo(i);$('chapterNav').appendChild(b)});render(0);
</script></body></html>
