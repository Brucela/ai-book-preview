</main><script>const STORY={"title":"大家都說月亮是甜的","scenes":[{"title":"月亮糖的名字","text":"圓圓在故事書裡看見一盞彎彎的紙燈。手指還沒碰到紙頁，書中的小廣場就亮了起來。米米和圓圓走進這個魔法世界，四周都是會說話的小星星。米米的紅領結映著暖光，圓圓的藍色牛仔吊帶褲也亮了一角。『今晚的月亮像糖！』一顆星星說。另一顆接著說：『月亮一定很甜。』話從桌邊傳到燈下，越傳越熱鬧。圓圓望著遠遠的彎月，想到甜甜的點心。『你有看過月亮糖嗎？』他問米米。米米搖搖頭，也好奇地抬起長耳朵。"},{"title":"大家聽誰說的","text":"兩個朋友走到圓桌旁，請小星星再說一次。『月亮很甜，是哪裡聽來的呢？』米米問。第一顆指著朋友，朋友又指向另一頭。原來大家都聽過這句話，卻沒有人吃過天上的月亮。圓圓看看桌上的紙燈。它也是彎彎的，顏色很像奶油。『這盞燈看起來也像點心。』他說。『可是它是紙做的。』掛燈的星星回答。圓圓把手留在自己身前，沒有拿燈來試。他現在更想知道，大家說的月亮糖，究竟是什麼東西，又為什麼會有這個名字。"},{"title":"找到寫名字的人","text":"廣場邊的小店有一扇矮窗，窗裡放著一個點心盒，盒上寫著『月亮糖』。成年點心師鹿阿姨正在收拾桌面。米米指著名字，請她說說看。『這是店裡做的小點心，因為形狀像彎月，所以取了這個名字。』鹿阿姨把盒子放在窗邊給他們看，再指指掛在上方的紙燈。『那盞燈也像月亮，卻是另外一樣東西。』圓圓看看點心，再看看燈。兩個都是彎彎的，可是一個在點心盒裡，一個有紙和燈架。他想起剛才聽到的話，好像少了幾個很重要的字。"},{"title":"把話說完整","text":"回到圓桌旁，圓圓對朋友們說：『店裡有叫月亮糖的點心，不是把天上的月亮拿來做糖。』米米接著說：『還有，月亮看起來像糖果，和月亮真的能吃，是兩句不同的話。』小星星們望望天空，又看看窗邊的盒子，終於找到那句傳聞的開頭。『那我想說，月亮像一片彎彎的葉子。』一顆星星笑了。『我覺得像小船！』另一顆跟著說。誰也不必去舔一口才能玩這個遊戲。圓圓用兩隻手圍出船的形狀，米米就在旁邊，假裝替它輕輕划槳。"},{"title":"一盞不是點心的燈","text":"廣場要收攤了。成年掛燈員把圓桌上那盞紙月亮掛回低低的燈架，讓大家最後坐一會兒。小星星說它像香蕉，米米說它像笑起來的嘴角。圓圓看著地上彎彎的影子：『我的小船要靠岸了。』他把想像的船停在米米手邊，兩個朋友都笑了。他們沒有帶走陌生的點心，也沒有碰天上的月亮，卻帶回好多不同的樣子。故事書翻回家中的燈光時，圓圓還用手在枕邊畫了一艘小船。船裡裝的不是糖，是今晚聽來又慢慢弄清楚的一個名字。"}],"boundaries":[44.43,90.96,139.58,186.21],"pictures":{"1":"images/scene-01.webp","2":"images/scene-02.webp","3":"images/scene-03.webp","4":"images/scene-04.webp","5":"images/scene-05.webp"},"pauseAfterScene":2,"pauseQuestion":"如果月亮只是看起來像某樣東西，你會想把它比作什麼？","closingQuestion":"今晚的月亮，在你的想像裡像什麼呢？"};
const $=id=>document.getElementById(id);

function render(i){

 $('pagination').textContent=n+' / '+STORY.scenes.length;
 $('prev').disabled=current===0;$('next').disabled=current===STORY.scenes.length-1;
 const src=STORY.pictures[String(n)];
 $('picture').hidden=!src;$('noPicture').hidden=!!src;
 if(src){$('picture').src=src;$('picture').alt='第'+n+'幕未驗收候選插畫'}
 $('artNote').textContent=src?(STORY.artNote||'L1 候選插畫｜尚未通過家長 L2 美術定稿驗收'):'第 '+n+' 幕｜正式插畫尚未完成';
 const question=n===STORY.pauseAfterScene?'親子互動（可略過）：'+STORY.pauseQuestion:n===STORY.scenes.length?'睡前的小問題：'+STORY.closingQuestion:'';
 $('question').hidden=!question;$('question').textContent=question;
 Array.from($('progress').children).forEach((p,j)=>p.classList.toggle('active',j<=current));Array.from($('chapterNav').children).forEach((p,j)=>{p.classList.toggle('active',j===current);p.setAttribute('aria-current',j===current?'step':'false');});
}
function seekTo(i){const j=Math.max(0,Math.min(STORY.scenes.length-1,i));audio.currentTime=j?STORY.boundaries[j-1]+0.06:0;render(j)}
$('prev').onclick=()=>seekTo(current-1);$('next').onclick=()=>seekTo(current+1);
audio.ontimeupdate=()=>{const page=STORY.boundaries.filter(t=>audio.currentTime>=t).length;if(page!==current)render(page)};
STORY.scenes.forEach((scene,i)=>{$('progress').appendChild(document.createElement('span'));const b=document.createElement('button');b.type='button';b.innerHTML='<span class="chapter-number">第 '+(i+1)+' 幕</span>';const span=document.createElement('span');span.textContent=scene.title;b.appendChild(span);b.onclick=()=>seekTo(i);$('chapterNav').appendChild(b)});render(0);
</script></body></html>
