</main><script>const STORY={"title":"玩具火車開錯路","scenes":[{"title":"一封送去藍色小站的信","text":"『這封信，要送到藍色小站。』河狸阿姨把一張畫著月亮的大紙信，交給米米和圓圓。玩具小鎮的車站遊戲室裡，地墊鋪得平平的，上面有一圈大木軌道。左下角是紅色車站，左上角有一座小花園，右上角則是掛著藍屋頂的小站。白兔米米扶扶紅色領結，把信放進黃色玩具火車的車廂。棕熊圓圓穿著藍色牛仔吊帶褲，跪坐在紅站旁邊。這台火車不用電，只要用手輕輕推，就能沿著軌道走。他們向紅站的小鐘揮揮手，讓送信的小火車出發了。"},{"title":"又聞到花香了","text":"小火車咕嚕咕嚕，先經過紅站旁的圓樹，再沿著彎軌往左走。『前面就是……花園？』圓圓停下手，看看車旁的粉紅色小花。他們想去的藍色小站，還在另一邊。米米走到藍站前，發現站口的兩段直軌沒有接到這條路上。『這裡還有一小段空空的。』他說。圓圓慢慢把火車推回紅站，又看了一次剛剛走過的彎道。從這裡往前，車輪仍然朝著花園的方向。『車子會跟著軌道走，我們來看看路怎麼接的。』圓圓把火車停回紅站，讓紙信安安靜靜留在車廂裡。"},{"title":"手指先走一遍","text":"米米坐在紅站旁，沿著軌道用手指走一遍。直直的，彎彎的，再往左邊，手指果然走到花園。圓圓則從藍站往回找，摸到兩段直軌的尾端。兩個朋友的手指隔著一小塊空地，輕輕向對方點點頭。『如果從這邊彎過來，就能碰在一起。』圓圓說。木盒裡還有幾段沒用到的大軌道，米米挑出一段往右彎的，平放在空地試一試。『這個方向朝向藍站。』他沒有把火車搬過來，而是先用手指慢慢繞過彎道，看看哪一端能接上，哪一端還差一段直直的路。"},{"title":"讓路慢慢接起來","text":"圓圓把紅站前那段朝花園彎的軌道取下，放回木盒。米米把朝藍站彎的那段接上，圓圓再拿來一段長直軌，接到站口原來的路。兩人一節一節看看，讓接頭平平靠好，沒有翹起來。『我們先慢慢推過去。』米米把手放在火車旁，圓圓輕輕往前送。小火車經過圓樹，這次往右轉，終於朝藍色屋頂走去。紙信在車廂裡晃了一下，卻沒有掉出來。到了站前，米米用手扶住車頭，圓圓把信拿起來。『月亮信送到啦！』他們一起輕輕說，像怕吵醒信上那彎小月亮。"},{"title":"明天再去花園","text":"河狸阿姨拿來藍站的大紙盒，讓他們把信放進去。米米找到蠟筆，在紙上畫出圓樹和藍屋頂。圓圓在兩個地方之間，畫上一道先彎再直的小路。『下次照這張圖，就能再送一封信。』他說。花園還留在地墊的左上角，粉紅色小花一朵也沒有少。『如果明天想去看花，我們可以再換一條路。』米米把畫好的路線放到紅站旁。今天的小火車就停在藍色屋頂下面。遊戲室的燈慢慢變柔，兩個朋友把木盒推回原位。窗外的晚風輕輕吹，火車留在藍色屋頂下，等待明天的第一封信。"}],"boundaries":[42.39,90.48,138.03,187.94],"pictures":{"1":"images/scene-01.webp","2":"images/scene-02.webp","3":"images/scene-03.webp","4":"images/scene-04.webp","5":"images/scene-05.webp"},"pauseAfterScene":2,"pauseQuestion":"你想看看哪一段軌道，知道火車會往哪裡走？","closingQuestion":"如果可以安排一段小火車旅行，你想讓它經過哪裡？"};
const $=id=>document.getElementById(id);
const audio=$('audio');let current=0;
function render(i){
 current=Math.max(0,Math.min(STORY.scenes.length-1,i));
 const n=current+1,scene=STORY.scenes[current];
 $('sceneNo').textContent='SCENE '+String(n).padStart(2,'0')+' / '+String(STORY.scenes.length).padStart(2,'0');
 $('sceneTitle').textContent=scene.title;$('text').textContent=scene.text;
 $('pagination').textContent=n+' / '+STORY.scenes.length;
 $('prev').disabled=current===0;$('next').disabled=current===STORY.scenes.length-1;
 const src=STORY.pictures[String(n)];
 $('picture').hidden=!src;$('noPicture').hidden=!!src;
 if(src){$('picture').src=src;$('picture').alt='第'+n+'幕未驗收候選插畫'}
 $('artNote').textContent=src?(STORY.artNote||'L1 候選插畫｜尚未通過家長 L2 美術定稿驗收'):'第 '+n+' 幕｜正式插畫尚未完成';
 const question=n===STORY.pauseAfterScene?'親子互動（可略過）：'+STORY.pauseQuestion:n===STORY.scenes.length?'睡前的小問題：'+STORY.closingQuestion:'';
 $('question').hidden=!question;$('question').textContent=question;
 Array.from($('progress').children).forEach((p,j)=>p.classList.toggle('active',j<=current));Array.from($('chapterNav').children).forEach((p,j)=>{p.classList.toggle('active',j===current);p.setAttribute('aria-current',j===current?'step':'false');});
}
function seekTo(i){const j=Math.max(0,Math.min(STORY.scenes.length-1,i));audio.currentTime=j?STORY.boundaries[j-1]+0.06:0;render(j)}
$('prev').onclick=()=>seekTo(current-1);$('next').onclick=()=>seekTo(current+1);
audio.ontimeupdate=()=>{const page=STORY.boundaries.filter(t=>audio.currentTime>=t).length;if(page!==current)render(page)};
STORY.scenes.forEach((scene,i)=>{$('progress').appendChild(document.createElement('span'));const b=document.createElement('button');b.type='button';b.innerHTML='<span class="chapter-number">第 '+(i+1)+' 幕</span>';const span=document.createElement('span');span.textContent=scene.title;b.appendChild(span);b.onclick=()=>seekTo(i);$('chapterNav').appendChild(b)});render(0);
</script></body></html>
