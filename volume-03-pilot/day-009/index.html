</main><script>const STORY={"title":"提著小燈找答案","scenes":[{"title":"書頁亮起來","text":"傍晚，米米和圓圓坐在地毯上，打開神奇故事書。一排小燈籠從書頁上亮起來，紅的、黃的，像一顆顆暖暖的小果子。白兔米米的紅領結，也被照得亮亮的。\n\n書裡畫著一條小街。屋簷下掛滿花燈，街口的牌子寫著「元宵燈會」。兔奶奶站在牌子旁，朝他們招招手。書頁輕輕翻動，兩個朋友就站到了奶奶身邊。\n\n奶奶替他們各準備了一盞燈籠。米米的是紅色圓燈籠，圓圓的是橘色圓燈籠，裡頭都裝著小燈泡。圓圓提起橘色燈籠，暖光落在他的藍牛仔吊帶褲上。\n\n「我的口袋也亮了。」\n\n米米低頭看看，把自己的燈籠輕輕挪過去。兩小團光靠在一起，照亮了他們腳邊的石板路。"},{"title":"燈下面的小紙條","text":"兔奶奶帶著他們，沿著小街慢慢走。屋簷下，一條魚形花燈張著圓嘴；隔壁的大花燈有五片粉紅花瓣，花心裡透出淡黃的光。再往前，還有一隻坐得端端正正的青蛙燈。\n\n圓圓停下腳步，仰頭看了好一會兒。青蛙燈的肚子鼓鼓的，兩隻眼睛圓圓的，像正等著誰來打招呼。\n\n花燈旁擺著一張小桌，桌上掛了一排紙條。奶奶指給他們看：這些是燈謎，把答案藏在幾句話裡，讓來賞燈的人一起猜。\n\n她挑了一張，念給他們聽。\n\n「圓圓一張臉，高高掛天邊。夜晚不開口，陪你走一走。」\n\n米米抬起耳朵。圓圓摸摸自己的臉，又抬頭看看花燈。原來今晚除了看燈，還可以找一個藏起來的答案。"},{"title":"找找圓圓的臉","text":"小桌的主人把那張燈謎借給奶奶，讓他們帶著找。米米和圓圓一人提著一盞小燈，跟奶奶繼續往前走。\n\n魚燈的眼睛很圓，青蛙燈的眼睛也很圓。可是紙條上還有「高高掛天邊」。他們沿著屋簷望過去，燈籠上面是深藍的天空，幾片薄薄的雲，正慢慢飄過屋頂。\n\n到了街角，視野開闊了。一個明亮的圓，從雲後露出半邊，又一點一點露出整張臉。\n\n「在那裡，月亮！」\n\n米米伸出空著的那隻手，指向天空。圓圓順著她的手看去，把燈謎的幾句話在心裡重新排了一遍。圓圓的，高高的，夜裡看得到。\n\n他們跟奶奶在街角走了幾步，又停下來抬頭。月亮仍在屋頂上方，把淡淡的光照在小街上。"},{"title":"答案也在燈裡","text":"回到小桌前，圓圓提穩橘色燈籠，抬起頭。\n\n「我們猜是月亮。」\n\n桌邊的阿姨笑著點點頭，翻過紙條。背面畫著一輪圓月，旁邊還有幾顆小星星。\n\n米米和圓圓靠近一點，看了又看。原來紙條的另一面，真的藏著今晚在天空找到的那張臉。\n\n奶奶把燈謎還給阿姨。三個人轉進旁邊的小廣場，那裡掛著一盞好大的月亮燈。燈下面站著一個小小孩，正把兩隻手往上伸，想比一比它有多大。\n\n圓圓也伸出空著的手，在面前比了一個圈。天上的月亮能裝進小小的圈裡，眼前的月亮燈卻裝不進去。米米站到他旁邊，把手張得更開。\n\n兩個朋友一起笑了。奶奶陪他們坐在廣場的長椅上，讓小腿歇一歇。兩盞燈籠穩穩提在膝邊，一紅一橘，輕輕照著鞋尖。"},{"title":"小燈陪著回家","text":"坐了一會兒，他們起身往回走。魚燈還在屋簷下，粉紅花燈也在。經過青蛙燈時，圓圓朝牠揮揮手，像跟一位今晚剛認識的朋友道別。\n\n小街另一頭，神奇故事書正攤開著。奶奶送他們到書頁前，替兩盞小燈整理好提把，再輕輕拍拍他們的肩。\n\n「晚安，奶奶。」\n\n米米和圓圓帶著小燈，走回家中的地毯。書頁裡的花燈縮小了，小街也慢慢遠了，最後留下兩個朋友並肩站在月亮燈下的圖畫。\n\n睡前，他們把燈籠放在桌上，關掉裡頭的小燈泡。米米拉好被角，圓圓把枕頭挪到舒服的位置。窗外的月亮，還露在窗框的一角。\n\n紅燈籠休息了，橘燈籠也休息了。\n\n米米和圓圓閉上眼睛。今晚的花燈、那張小紙條，還有一起找到的月亮，都好好地留在故事裡。\n\n晚安。"}],"boundaries":[59.449999999999996,116.57,170.64999999999998,231.28999999999996],"pictures":{"1":"images/scene-01.webp","2":"images/scene-02.webp","3":"images/scene-03.webp","4":"images/scene-04.webp","5":"images/scene-05.webp"},"closingQuestion":"","artNote":"L1 水彩候選插畫｜美術細節待家長確認"};
const $=id=>document.getElementById(id);
const audio=$('audio');let current=0;
function render(i){
 current=Math.max(0,Math.min(STORY.scenes.length-1,i));
 const n=current+1,scene=STORY.scenes[current];
 $('sceneNo').textContent='SCENE '+String(n).padStart(2,'0')+' / '+String(STORY.scenes.length).padStart(2,'0');
 $('sceneTitle').textContent=scene.title;$('text').textContent=scene.text;
 $('pagination').textContent=n+' / '+STORY.scenes.length;
 $('prev').disabled=current===0;$('next').disabled=current===STORY.scenes.length-1;
 const src=STORY.pictures[String(n)];
 $('picture').hidden=!src;$('noPicture').hidden=!!src;
 if(src){$('picture').src=src;$('picture').alt='第'+n+'幕未驗收候選插畫'}
 $('artNote').textContent=src?(STORY.artNote||'L1 候選插畫｜尚未通過家長 L2 美術定稿驗收'):'第 '+n+' 幕｜正式插畫尚未完成';
 const question=n===STORY.pauseAfterScene?'親子互動（可略過）：'+STORY.pauseQuestion:n===STORY.scenes.length&&STORY.closingQuestion?'睡前的小問題：'+STORY.closingQuestion:'';
 $('question').hidden=!question;$('question').textContent=question;
 Array.from($('progress').children).forEach((p,j)=>p.classList.toggle('active',j<=current));Array.from($('chapterNav').children).forEach((p,j)=>{p.classList.toggle('active',j===current);p.setAttribute('aria-current',j===current?'step':'false');});
}
function seekTo(i){const j=Math.max(0,Math.min(STORY.scenes.length-1,i));audio.currentTime=j?STORY.boundaries[j-1]+0.06:0;render(j)}
$('prev').onclick=()=>seekTo(current-1);$('next').onclick=()=>seekTo(current+1);
audio.ontimeupdate=()=>{const page=STORY.boundaries.filter(t=>audio.currentTime>=t).length;if(page!==current)render(page)};
STORY.scenes.forEach((scene,i)=>{$('progress').appendChild(document.createElement('span'));const b=document.createElement('button');b.type='button';b.innerHTML='<span class="chapter-number">第 '+(i+1)+' 幕</span>';const span=document.createElement('span');span.textContent=scene.title;b.appendChild(span);b.onclick=()=>seekTo(i);$('chapterNav').appendChild(b)});audio.onseeking=audio.onplay=()=>{$('playbackStatus').textContent='本篇圖文與多角色聲音為公開 L1 候選試閱，尚待家長完整聽審、素材授權與正式出版驗收。';};audio.onended=()=>{render(STORY.scenes.length-1);$('playbackStatus').textContent='故事播完了，晚安。';};audio.onerror=()=>{$('playbackStatus').textContent='音訊載入失敗，請稍後再試。';};render(0);
</script></body></html>
